name: deney
on:
  push:
    branches: [deney]
    paths: [tools/**]
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe.py > dump.log 2>&1 || true
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f dump.log; git commit -m "veri" && git push
