name: canli

# Maç saatlerinde skorları her dakika ESPN'den alıp "canli" dalına yazar.
# 20 dakikada bir kontrol eder: canlı ya da 40 dakika içinde başlayacak maç yoksa hemen kapanır.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canli
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py canli
