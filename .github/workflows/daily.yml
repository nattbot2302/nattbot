name: daily

on:
  schedule:
    - cron: "0 5 * * *"   # her gün 08:00 (Türkiye saati)
    - cron: "0 11 * * *"  # her gün 14:00: öğleden sonra maçları için oranları ve tahminleri tazeler
    - cron: "30 20 * * *" # her gün 23:30: günün sonuçlarını ve kuponları işler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Sayfayı ve karneyi kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html canli.html bahis.html analiz.html karne.html data
          git diff --cached --quiet || git commit -m "güncelleme"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
